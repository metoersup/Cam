<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الكاميرا المباشر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #f1f1f1;
        }

        .video-box {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* لقلب الكاميرا الأمامية بشكل طبيعي */
        }

        .placeholder-text {
            position: absolute;
            color: #aaa;
            font-size: 0.9rem;
        }

        .btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.stop {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>بث الكاميرا المباشر</h2>
        
        <!-- نافذة عرض الكاميرا -->
        <div class="video-box">
            <span class="placeholder-text" id="statusText">الكاميرا متوقفة</span>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <!-- أزرار التحكم -->
        <button class="btn" id="startBtn" onclick="startCamera()">تشغيل الكاميرا</button>
        <button class="btn stop" id="stopBtn" onclick="stopCamera()" style="display: none;">إيقاف الكاميرا</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        let mediaStream = null;

        async function startCamera() {
            try {
                // طلب تشغيل الكاميرا (يفضل الكاميرا الأمامية user أو الخلفية environment)
                const constraints = {
                    video: { facingMode: "user" },
                    audio: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = mediaStream;
                
                // إخفاء النص وإظهار زر الإيقاف
                statusText.style.display = 'none';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';

            } catch (error) {
                console.error("خطأ في تشغيل الكاميرا:", error);
                alert("تعذر الوصول إلى الكاميرا. تأكد من منح الإذن أو أن الصفحة تعمل عبر بروتوكول امن (HTTPS أو Localhost).");
            }
        }

        function stopCamera() {
            if (mediaStream) {
                let tracks = mediaStream.getTracks();
                tracks.forEach(track => track.stop()); // إيقاف جميع مسارات الكاميرا
                videoElement.srcObject = null;
            }

            // إعادة الواجهة لحالتها الأصلية
            statusText.style.display = 'block';
            stopBtn.style.display = 'none';
            startBtn.style.display = 'block';
        }
    </script>

</body>
</html>
